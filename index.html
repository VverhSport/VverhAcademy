<style>
:root{
  --purple:#6C619C; --purple-d:#4D3073; --green:#64B145; --orange:#EF7C00; --ink:#0A0A0D;
  --ink2:#3B3944; --muted:#8C8996; --bg:#EEEEEE; --card:#FFFFFF; --line:#ECEAF1; --soft:#F7F6FA;
  --r:22px; --font:'Unbounded', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.35;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
@media(min-width:720px){.wrap{padding:0 28px}}

/* Шапка */
.hero{position:relative;overflow:hidden;background:var(--purple);color:#fff;padding:26px 0 34px}
.hero-mark{position:absolute;right:10px;top:12px;width:200px;height:194px;pointer-events:none}
.hero-mark .x{fill:#776EA3}
@media(min-width:720px){.hero{padding:34px 0 46px}.hero-mark{right:2%;top:-60px;height:calc(100% + 120px);width:auto;aspect-ratio:158/153}}
.hero-in{position:relative}
.logo{display:inline-block}
.logo svg{display:block;width:118px;height:auto}
@media(min-width:720px){.logo svg{width:150px}}
.logo-w{color:#fff;--hg:#fff;--hp:#fff;--ho:#fff}
h1{font-weight:300;text-transform:uppercase;font-size:clamp(34px,8.4vw,78px);line-height:.98;letter-spacing:-.01em;margin:140px 0 14px}
@media(min-width:720px){h1{margin-top:64px}}
.lead{font-weight:300;font-size:clamp(12px,1.5vw,15px);opacity:.92;max-width:40ch}
.meta{margin-top:20px;display:inline-flex;gap:9px;align-items:center;font-size:11.5px;background:rgba(255,255,255,.15);border-radius:999px;padding:8px 14px 8px 12px}
.meta .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(100,177,69,.28)}
.meta.demo .dot{background:var(--orange);box-shadow:0 0 0 4px rgba(239,124,0,.28)}
.meta.err .dot{background:#ff6b6b;box-shadow:0 0 0 4px rgba(255,107,107,.28)}

/* Вкладки */
.tabs-bar{background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:8px;padding:14px 0 4px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:500;font-size:11.5px;line-height:1.15;color:var(--ink);background:#fff;border-radius:999px;padding:13px 8px;transition:background .2s,color .2s,transform .1s;text-align:center}
.tab i{flex:0 0 auto;width:10px;height:10px;border-radius:3px;transform:rotate(45deg);background:var(--c)}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected=true]{background:var(--c);color:#fff}
.tab[aria-selected=true] i{background:#fff}
@media(min-width:760px){
  .tabs-bar{position:sticky;top:0;z-index:5;background:rgba(238,238,238,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .tabs{display:flex;padding:14px 0}
  .tab{font-size:13px;padding:13px 20px}
  .tab.t-rules{margin-left:auto}
}

/* Панель фильтров */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #DEDCE5;background:#fff;border-radius:999px;padding:8px 13px;font-size:11.5px;line-height:1;cursor:pointer;color:var(--ink2);transition:.15s}
.chip i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--c)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed=true] i{background:#fff}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search input{width:100%;border:1px solid #DEDCE5;background:#fff;border-radius:999px;padding:11px 16px 11px 40px;font-size:12px;outline:none}
.search input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(108,97,156,.15)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}

/* Заголовок раздела */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:22px 0 4px}
.sec-head h2{display:flex;align-items:center;gap:12px;font-weight:600;font-size:clamp(22px,3.4vw,32px);line-height:1.1}
.dia{flex:0 0 auto;width:16px;height:16px;border-radius:4px;transform:rotate(45deg);background:var(--c)}
.sec-head p{font-size:11.5px;color:var(--muted);margin-top:8px;font-weight:300}
.stat{text-align:right;flex:0 0 auto}
.stat b{display:block;font-size:clamp(24px,3.6vw,34px);font-weight:600;line-height:1;color:var(--c)}
.stat span{font-size:10.5px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);font-weight:300;margin:6px 0 16px}

/* Карточки категорий */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px 8px;display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.age{font-weight:600;font-size:17px}
.g{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;background:var(--c)}
.cnt{margin-left:auto;font-size:10.5px;color:var(--muted)}
.rows{list-style:none}
.row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.nm{font-weight:500;font-size:13px;line-height:1.25}
.co{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:300}
.pts{font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.row.top{}
.card.is-empty{background:transparent;border:1.5px dashed #D6D3DE}
.none{font-size:11.5px;color:var(--muted);padding:6px 0 14px;font-weight:300}
.more{margin:8px 0 6px;align-self:flex-start;border:0;background:var(--soft);border-radius:999px;padding:8px 13px;font-size:10.5px;color:var(--ink2);cursor:pointer}
.more:hover{background:#EEECF4}

/* Ромб места */
.place{position:relative;width:34px;height:34px;display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink2)}
.place::before{content:"";position:absolute;inset:5px;border-radius:7px;transform:rotate(45deg);border:1.5px solid #DEDCE5;background:#fff}
.place span{position:relative}
.place.p1,.place.p2,.place.p3{color:#fff}
.place.p1::before{border:0;background:linear-gradient(135deg,#F6D57A,#D39A2A)}
.place.p2::before{border:0;background:linear-gradient(135deg,#D3D7DE,#959CA8)}
.place.p3::before{border:0;background:linear-gradient(135deg,#E6A877,#B46B38)}
.place.sm{width:30px;height:30px;font-size:11px}

/* Общий результат */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:18px;padding:14px 16px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-14px;bottom:-14px;width:46px;height:46px;border-radius:10px;transform:rotate(45deg);background:var(--c);opacity:.9}
.tile b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.tile span{font-size:10.5px;color:var(--muted)}
.cat{background:#fff;border-radius:var(--r);margin:14px 0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;padding:15px 18px 12px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
th{font-weight:500;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:9px 6px;background:var(--soft);white-space:nowrap}
td{padding:8px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap;background:#fff;font-variant-numeric:tabular-nums}
.c-pl{position:sticky;left:0;z-index:1;width:62px;min-width:62px;max-width:62px;padding-left:12px}
.c-nm{position:sticky;left:62px;z-index:1;text-align:left;min-width:150px;max-width:220px;white-space:normal;box-shadow:6px 0 8px -8px rgba(0,0,0,.25)}
th.c-nm{text-align:left}
.c-br{text-align:left;font-size:10.5px;color:var(--ink2)}
.c-br i{display:inline-block;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--c);margin-right:8px;vertical-align:1px}
.c-r{min-width:34px;color:var(--ink2)}
.c-r.z{color:#C9C6D1}
.c-sum{position:sticky;right:0;z-index:1;font-weight:700;font-size:14px;padding-right:16px;min-width:64px;box-shadow:-6px 0 8px -8px rgba(0,0,0,.25)}
th.c-pl,th.c-nm,th.c-sum{background:var(--soft)}
th.c-sum{font-size:9.5px;font-weight:500;color:var(--ink2)}
tbody tr:hover td{background:#FBFAFD}
@media(max-width:759px){.c-nm{min-width:128px;max-width:150px}.c-nm .nm{font-size:11.5px}.c-nm .co{font-size:9.5px}.c-sum{min-width:52px;padding-right:12px;font-size:13px}.c-r{min-width:30px}}
@media(min-width:760px){.c-nm{min-width:210px;max-width:280px}}


/* Переключатель вида */
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 15px;font-size:11.5px;line-height:1;cursor:pointer;color:var(--ink2);transition:.15s}
.seg button[aria-pressed=true]{background:var(--purple);color:#fff}
.co i{display:inline-block;width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--c);margin:0 6px 0 1px;vertical-align:1px}
.c-st{min-width:84px}
.c-st b{font-weight:600;font-size:12.5px}
.c-st small{display:block;font-size:9px;color:var(--muted);margin-top:2px;font-weight:300}
.c-st.z{color:#C9C6D1}
.tab .long{display:none}
@media(min-width:760px){.tab .long{display:inline}}


/* Протокол: трассы и уровни */
.rt{display:inline-flex;align-items:center;gap:5px}
.rt i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--h);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
th.c-r small{display:block;font-size:8.5px;letter-spacing:0;text-transform:none;margin-top:3px;color:var(--muted);font-weight:400}
.v{display:inline-block;min-width:30px;padding:4px 6px;border-radius:8px;line-height:1.1}
.v.top{background:var(--purple);color:#fff;font-weight:600}
.v.z2{background:#E3E0EE;color:var(--ink)}
.v.z1{background:#fff;box-shadow:inset 0 0 0 1.5px #E3E0EE}
.v.z{color:#C9C6D1}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:10.5px;color:var(--ink2);margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .v{font-size:9.5px;min-width:0;padding:3px 6px;font-weight:500}
tr.divider td{background:var(--soft);text-align:left;padding:8px 12px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tr.divider td span{position:sticky;left:12px}
tr.is-out td{color:var(--muted)}
tr.is-out .nm{color:var(--ink2)}
.place.out{color:#B9B5C6}
.place.out::before{border-style:dashed}
.notice.info{border-left-color:var(--purple);margin:14px 0 0}

/* Регламент */
.rules{max-width:900px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
@media(min-width:760px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{background:#fff;border-radius:18px;padding:16px 16px 14px;position:relative;overflow:hidden}
.fact::after{content:"";position:absolute;right:-16px;top:-16px;width:46px;height:46px;border-radius:10px;transform:rotate(45deg);background:var(--c)}
.fact b{display:block;font-size:26px;font-weight:600;line-height:1.05;color:var(--c)}
.fact span{display:block;font-size:10.5px;color:var(--ink2);margin-top:6px;font-weight:300}
.r-card{background:#fff;border-radius:var(--r);padding:20px 18px;margin:12px 0}
.timeline{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:760px){.timeline{grid-template-columns:1fr 1fr 1fr;gap:12px}}
.tl{position:relative;display:flex;gap:14px;align-items:flex-start}
.tl-n{flex:0 0 auto;position:relative;width:44px;height:44px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
.tl-n::before{content:"";position:absolute;inset:6px;border-radius:9px;transform:rotate(45deg);background:var(--c)}
.tl-n span{position:relative}
.tl h4{font-size:14px;font-weight:600;margin:4px 0 6px}
.tl p{font-size:11px;font-weight:300;color:var(--ink2);line-height:1.5}
.tl p b{font-weight:500;color:var(--ink)}
.r-sec{background:#fff;border-radius:var(--r);padding:20px 18px 18px;margin:12px 0}
@media(min-width:760px){.r-sec{padding:24px 28px 22px}}
.r-sec>header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.r-num{flex:0 0 auto;position:relative;width:36px;height:36px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.r-num::before{content:"";position:absolute;inset:5px;border-radius:7px;transform:rotate(45deg);background:var(--c)}
.r-num span{position:relative}
.r-sec h3{font-size:16px;font-weight:600;line-height:1.2}
.r-sec p{font-size:12.5px;font-weight:300;line-height:1.7;color:var(--ink2);margin:0 0 10px}
.r-sec p:last-child{margin-bottom:0}
.r-sec a{color:var(--purple);font-weight:500}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 14px}
.cat-chip{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.cat-chip b{display:block;font-size:14px;font-weight:600}
.cat-chip span{font-size:10px;color:var(--muted);font-weight:300}
.callout{border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:12px;line-height:1.6;font-weight:300;color:var(--ink2);background:var(--soft);border-left:4px solid var(--c)}
.callout b{font-weight:500;color:var(--ink)}
.dates{display:grid;gap:6px;margin:12px 0 0}
.dates div{display:flex;gap:10px;align-items:baseline;font-size:12px;font-weight:300;color:var(--ink2);line-height:1.5}
.dates i{flex:0 0 auto;width:9px;height:9px;border-radius:2px;transform:rotate(45deg) translateY(-1px);background:var(--c)}
.dates b{font-weight:500;color:var(--ink)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0;font-size:12px}
.formula span{background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:500}
.formula em{font-style:normal;color:var(--muted);font-weight:600}
.formula strong{background:var(--purple);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600}
.one{display:flex;align-items:center;gap:14px;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--soft)}
.one b{font-size:30px;font-weight:600;line-height:1;color:var(--c)}
.one span{font-size:12px;font-weight:300;color:var(--ink2);line-height:1.5}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:14px 0 12px;font-size:11px}
.flow span{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:500;color:var(--ink2)}
.flow svg{width:22px;height:10px;flex:0 0 auto}

<article class="rules">
  <div class="sec-head" style="--c:#64B145"><div><h2><i class="dia"></i>Регламент</h2>
    <p>Регламент проведения «Кубок Вверх 2026–2027»</p></div></div>

  <div class="facts">
    <div class="fact" style="--c:#6C619C"><b>2</b><span>этапа по 2 недели</span></div>
    <div class="fact" style="--c:#64B145"><b>4–15</b><span>лет · 5 возрастных категорий</span></div>
    <div class="fact" style="--c:#EF7C00"><b>10–12</b><span>трасс на каждом этапе</span></div>
    <div class="fact" style="--c:#0A0A0D"><b>1</b><span>попытка на одной трассе</span></div>
  </div>

  <div class="r-card">
    <div class="timeline">
      <div class="tl" style="--c:#6C619C"><span class="tl-n"><span>1</span></span>
        <div><h4>1 этап</h4><p><b>ТЦ «Сказка»</b><br>с 26 октября по 8 ноября</p></div></div>
      <div class="tl" style="--c:#64B145"><span class="tl-n"><span>2</span></span>
        <div><h4>2 этап</h4><p><b>ТРК «Галактика»</b><br>предварительно март–апрель 2027 года</p></div></div>
      <div class="tl" style="--c:#EF7C00"><span class="tl-n"><span>∑</span></span>
        <div><h4>Итог кубка</h4><p><b>Сумма баллов за оба этапа</b><br>для борьбы за кубок нужны оба этапа</p></div></div>
    </div>
  </div>

  <section class="r-sec" style="--c:#6C619C">
    <header><span class="r-num"><span>1</span></span><h3>Общие положения</h3></header>
    <p>Кубок «Вверх» — ежегодное соревнование академии по скалолазанию, состоящее из двух этапов. Первый этап проходит в ТЦ «Сказка», второй в ТРК «Галактика». Каждый этап длится 2 недели. Итоговый результат складывается из суммы баллов за оба этапа. Для участия в борьбе за кубок обязательно прохождение обоих этапов.</p>
    <div class="dates">
      <div><i></i><span>Первый этап проходит <b>с 26 октября по 8 ноября</b>.</span></div>
      <div><i></i><span>Дата второго этапа на этапе согласования. Предварительная дата: <b>март–апрель 2027 года</b>.</span></div>
    </div>
  </section>

  <section class="r-sec" style="--c:#64B145">
    <header><span class="r-num"><span>2</span></span><h3>Участники и категории</h3></header>
    <p>К участию допускаются воспитанники академии в возрасте от 4 до 15 лет, а также имеющие разряды с 1–3 юношеский (включительно) или без разряда. Участники делятся по таким возрастным категориям:</p>
    <div class="cats">
      <div class="cat-chip"><b>4–5 лет</b><span>мальчики и девочки</span></div>
      <div class="cat-chip"><b>6–7 лет</b><span>мальчики и девочки</span></div>
      <div class="cat-chip"><b>8–9 лет</b><span>мальчики и девочки</span></div>
      <div class="cat-chip"><b>10–12 лет</b><span>мальчики и девочки</span></div>
      <div class="cat-chip"><b>13–15 лет</b><span>мальчики и девочки</span></div>
    </div>
    <div class="callout">Воспитанники филиалов <b>«Галактика»</b> и <b>«Красная площадь»</b>, желающие участвовать, проходят первый этап на <b>«Сказке»</b> — либо по договорённости со своим тренером, либо через запись на тренировку к тренеру со «Сказки».</div>
  </section>

  <section class="r-sec" style="--c:#EF7C00">
    <header><span class="r-num"><span>3</span></span><h3>Трассы</h3></header>
    <p>На каждом этапе устанавливается от 10 до 12 трасс (итоговое число утверждает старший постановщик Пожаров Всеволод). Трассы различаются по сложности и распределяются так, чтобы каждая категория имела достаточную нагрузку.</p>
  </section>

  <section class="r-sec" style="--c:#6C619C">
    <header><span class="r-num"><span>4</span></span><h3>Начисление баллов</h3></header>
    <div class="flow"><span>Зона 1</span><svg viewBox="0 0 22 10" aria-hidden="true"><path d="M1 5h17" stroke="#B9B5C6" stroke-width="1.5" stroke-dasharray="3 3"/><path d="m16 1.5 4 3.5-4 3.5" fill="none" stroke="#B9B5C6" stroke-width="1.5"/></svg><span>Зона 2</span><svg viewBox="0 0 22 10" aria-hidden="true"><path d="M1 5h17" stroke="#B9B5C6" stroke-width="1.5" stroke-dasharray="3 3"/><path d="m16 1.5 4 3.5-4 3.5" fill="none" stroke="#B9B5C6" stroke-width="1.5"/></svg><span>Топ</span></div>
    <p>Баллы начисляются за взятие зоны 1, зоны 2 и топа. Трасса засчитывается при прохождении по установленным правилам без нарушений. Итоговый рейтинг участника — сумма баллов за оба этапа. Победители в каждой категории определяются по наибольшей сумме баллов.</p>
    <div class="formula"><span>1 этап</span><em>+</em><span>2 этап</span><em>=</em><strong>итоговый рейтинг</strong></div>
    <div class="callout">При равенстве баллов устанавливаются одинаковые места, следующее место после них пропускается. Например:<div class="medals" style="margin:10px 0 2px"><span class="place p1"><span>1</span></span><span class="place p2"><span>2</span></span><span class="place p2"><span>2</span></span><span class="place"><span>4</span></span></div></div>
  </section>

  <section class="r-sec" style="--c:#64B145">
    <header><span class="r-num"><span>5</span></span><h3>Правила прохождения и судейства</h3></header>
    <p>Трасса считается пройденной, если участник преодолел её самостоятельно, без физической помощи и подсказок по маршруту. Судья (тренер) обязан фиксировать только фактический результат.</p>
    <div class="callout" style="--c:#EF7C00;margin-bottom:12px">Тренер, судящий своих воспитанников, обязан оценивать их по единым правилам наравне со всеми. Любая форма «подтягивания» участника на трассе, лишние попытки сверх регламента или завышение результата являются нарушением и ведут к <b>аннулированию зачёта по трассе</b>.</div>
    <p>До старта первого этапа проводится обязательное собрание тренерского состава, на котором проговариваются правила, единые критерии зачёта и ответственность за их несоблюдение. Собрание опирается на настоящий регламент как на письменный документ.</p>
    <div class="one"><b>1</b><span>Каждый участник проходит 1 попытку на одной трассе.</span></div>
  </section>

  <section class="r-sec" style="--c:#EF7C00">
    <header><span class="r-num"><span>6</span></span><h3>Фиксация и подсчёт результатов</h3></header>
    <div class="flow">
      <span>Пролаз</span><svg viewBox="0 0 22 10" aria-hidden="true"><path d="M1 5h17" stroke="#B9B5C6" stroke-width="1.5" stroke-dasharray="3 3"/><path d="m16 1.5 4 3.5-4 3.5" fill="none" stroke="#B9B5C6" stroke-width="1.5"/></svg>
      <span>Google-форма</span><svg viewBox="0 0 22 10" aria-hidden="true"><path d="M1 5h17" stroke="#B9B5C6" stroke-width="1.5" stroke-dasharray="3 3"/><path d="m16 1.5 4 3.5-4 3.5" fill="none" stroke="#B9B5C6" stroke-width="1.5"/></svg>
      <span>Онлайн-рейтинг</span>
    </div>
    <p>Результаты вносятся тренерами в единую Google-форму в течение 3 дней после пролаза участника. Данные автоматически поступают в онлайн-таблицу рейтинга, доступную для отслеживания в реальном времени по каждой категории. Ссылка: <a href="https://vverhsport.github.io/VverhAcademy/">vverhsport.github.io/VverhAcademy</a></p>
    <p>Промежуточные результаты обновляются в реальном времени. Об итоговых результатах этапа сообщим отдельным постом.</p>
  </section>

  <section class="r-sec" style="--c:#6C619C">
    <header><span class="r-num"><span>7</span></span><h3>Награждение</h3></header>
    <div class="awards">
      <div class="award">
        <h4>Каждый этап</h4>

<script>
/* ====== НАСТРОЙКИ ====== */
const CONFIG = {
  SHEET_ID: '1UAX-xXoaTuoZqW07QoYIyL-WcJ8YCCNCcXdvQPt7FHc', // таблица «Клубные старты «Вверх» — база»
  SHEET_NAME: 'Form_Responses', // лист с ответами формы
  CUP: 'Кубок «Вверх»',         // название кубка
  CUP_GEN: 'Кубка «Вверх»',     // для заголовков: «1 этап Кубка «Вверх»»
  STAGES: [1, 2],               // этапы кубка (вкладки видны всегда)
  STAGE_INFO: {                 // где и когда проходят этапы — из регламента
    1: {place: 'ТЦ «Сказка»',     dates: '26 октября — 8 ноября 2026'},
    2: {place: 'ТРК «Галактика»', dates: 'март — апрель 2027, дата уточняется'},
  },
  REQUIRE_ALL_STAGES: true,     // в зачёт кубка — только прошедшие все проведённые этапы
  TOP: 10,                      // сколько спортсменов показывать в категории в режиме «Топ-10»
  REFRESH_MIN: 2,               // автообновление, минут
  SHOW_PATRONYMIC: false,       // показывать отчество спортсмена
};
/* ======================= */

const BRANCHES = [
  {id:'galaktika', name:'Галактика',       full:'ТРК «Галактика»',       addr:'ул. Уральская, 98/11',      color:'#4D3073', re:/галакт/},
  {id:'skazka',    name:'Сказка',          full:'ТЦ «Сказка»',           addr:'ул. Шоссе Нефтяников, 42',  color:'#64B145', re:/сказк/},
  {id:'krasnaya',  name:'Красная площадь', full:'МЦ «Красная площадь»',  addr:'ул. Дзержинского, 100',     color:'#EF7C00', re:/красн/},
];
const BR = Object.fromEntries(BRANCHES.map(b => [b.id, b]));
const AGES = ['4–5','6–7','8–9','10–12','13–15'];
const GENDERS = ['Ж','М'];
const DEMO = !CONFIG.SHEET_ID || new URLSearchParams(location.search).has('demo');

/* цвета зацепов для подписи трасс в протоколе */
const HOLD_COLORS = [
  [/фиолет/,'#7E57C2'], [/син/,'#1E63D6'], [/голуб/,'#4FC3F7'], [/ж[её]лт/,'#F2C200'], [/салат/,'#9BD13B'],
  [/зел[её]н/,'#43A047'], [/ч[её]рн/,'#1D1D1B'], [/розов/,'#F06292'], [/красн/,'#E53935'], [/оранж/,'#FB8C00'],
  [/бел/,'#FFFFFF'], [/сер/,'#9E9E9E'], [/коричн/,'#8D6E63'], [/бирюз/,'#26A69A'],
];

const state = {tab:null, userTab:false, mode:{}, age:'all', branch:'all', q:'', D:null, meta:[], updated:null, error:null};

/* ---------- утилиты ---------- */
const norm = s => String(s ?? '').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => Number.isInteger(v) ? String(v) : String(Math.round(v*10)/10).replace('.', ',');
function plural(n, f){ const a=Math.abs(n)%100, b=a%10; return f[(a>10&&a<20)?2:(b===1?0:(b>=2&&b<=4?1:2))]; }
const people = n => `${n} ${plural(n,['участник','участника','участников'])}`;
const routesWord = n => `${n} ${plural(n,['трассу','трассы','трасс'])}`;
function titleCase(w){ return w.split('-').map(p => p ? p[0].toUpperCase()+p.slice(1).toLowerCase() : p).join('-'); }
function displayName(raw){
  let w = String(raw).trim().split(/\s+/).filter(Boolean);
  if(!CONFIG.SHOW_PATRONYMIC && w.length > 2) w = w.slice(0,2);
  return w.map(titleCase).join(' ');
}
function parseCat(label){
  const s = norm(label);
  const m = s.match(/(\d+)\D{1,4}?(\d+)/);
  if(!m) return null;
  const age = `${+m[1]}–${+m[2]}`;
  const toks = s.replace(/\d+/g,' ').split(/[^a-zа-я]+/).filter(Boolean);
  let g = null;
  if(toks.some(t => t==='м' || /^(муж|мал|юн)/.test(t))) g = 'М';
  else if(toks.some(t => t==='ж' || /^(жен|дев)/.test(t))) g = 'Ж';
  return g ? {age, g} : null;
}
function parseStage(v){
  const s = norm(v), m = s.match(/\d+/);
  if(m) return +m[0];
  const w = [/перв/,/втор/,/трет/,/четв/,/пят/].findIndex(re => re.test(s));
  return w >= 0 ? w + 1 : (CONFIG.STAGES[0] || 1);   // пустой «Этап» — первый этап
}
// ключ человека: без отчества и без учёта порядка слов («Илья Чубенко Сергеевич» = «Чубенко Илья»)
const nameKey = v => norm(v).split(' ').filter(w => !/(вич|вна|ична|оглы|кызы)$/.test(w)).sort().join(' ');
const parseBranch = v => (BRANCHES.find(b => b.re.test(norm(v))) || {}).id || null;
const ageOrder = a => { const i = AGES.indexOf(a); return i < 0 ? 100 + parseInt(a) : i; };

/* «Трасса 1. Фиолетовая 5Б. зона1 -4Б, зона2 -7Б, топ-10Б.» → описание трассы */
function parseRoute(label, n){
  const s = String(label || '');
  const head = s.replace(/^\s*трасса\s*\d+\s*[.:,]?\s*/i, '').split(/зона|топ/i)[0];
  const color = (head.match(/[А-Яа-яЁё]+/) || [''])[0];
  const grade = (head.match(/\b\d[A-Za-zА-Яа-я]\+?/) || [''])[0];
  const pts = re => { const m = s.match(re); return m ? +m[1] : null; };
  const z1 = pts(/зона\s*1\D{0,4}?(\d+)/i), z2 = pts(/зона\s*2\D{0,4}?(\d+)/i), top = pts(/топ\D{0,4}?(\d+)/i);
  const hc = HOLD_COLORS.find(([re]) => re.test(norm(color)));
  return {n, color, grade, z1, z2, top, hex: hc ? hc[1] : '#B9B5C6'};
}
/* значение ответа → баллы; понимает и числа («10»), и текст («Топ», «Зона 2») */
function routePoints(cell, meta){
  if(cell == null) return 0;
  const raw = cell.v ?? cell.f ?? '';
  if(typeof raw === 'number') return raw;
  const s = norm(raw);
  if(!s) return 0;
  if(meta){
    if(/топ|top/.test(s) && meta.top != null) return meta.top;
    if(/зона\s*2/.test(s) && meta.z2 != null) return meta.z2;
    if(/зона\s*1/.test(s) && meta.z1 != null) return meta.z1;
  }
  const n = parseFloat(s.replace(',', '.'));
  return isFinite(n) ? n : 0;
}
const level = (v, m) => !v ? 'z' : m && v === m.top ? 'top' : m && v === m.z2 ? 'z2' : m && v === m.z1 ? 'z1' : '';

/* ---------- данные ---------- */
async function fetchSheet(){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
  const text = await (await fetch(url, {cache:'no-store'})).text();
  if(text.indexOf('"table"') === -1) throw new Error('Таблица не открыта для просмотра по ссылке или лист не найден');
  return JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
}

function parseSheet(json){
  const raw = json.table.cols.map(c => c.label || c.id || '');
  const cols = raw.map(norm);
  const find = re => cols.findIndex(c => re.test(c));
  const iCat = find(/категор/), iName = find(/фио/) >= 0 ? find(/фио/) : find(/спортсмен/);
  const iBr = find(/филиал/), iCoach = find(/тренер/), iStage = find(/этап/);
  const rc = cols.map((c,i) => { const m = c.match(/трасс\D*(\d+)/); return m ? {n:+m[1], i} : null; })
                 .filter(Boolean).sort((a,b) => a.n - b.n);
  const meta = rc.map(x => parseRoute(raw[x.i], x.n));
  const txt = c => c == null ? '' : String(c.v ?? c.f ?? '');
  const rows = (json.table.rows || []).map(r => ({
    stage: iStage >= 0 ? txt(r.c[iStage]) : '', cat: txt(r.c[iCat]), name: txt(r.c[iName]), branch: txt(r.c[iBr]),
    coach: iCoach >= 0 ? txt(r.c[iCoach]) : '', routes: rc.map((x,k) => routePoints(r.c[x.i], meta[k]))
  }));
  return {rows, meta};
}

function rank(list, key){
  list.sort((a,b) => b.total - a.total || a.name.localeCompare(b.name,'ru'));
  list.forEach((r,i) => { r[key] = (i && r.total === list[i-1].total) ? list[i-1][key] : i + 1; });
}
function rankGroups(list, groupOf){
  const groups = {};
  list.forEach(r => (groups[groupOf(r)] ||= []).push(r));
  for(const g of Object.values(groups)){
    rank(g, 'place');                                                           // место среди всех филиалов
    for(const b of BRANCHES) rank(g.filter(r => r.branch === b.id), 'bplace');  // место внутри филиала
  }
}

function build(rows, nRoutes){
  const byKey = new Map();   // повтор ФИО в той же категории и том же этапе — берётся последняя запись
  for(const r of rows){
    const cat = parseCat(r.cat);
    if(!cat || !String(r.name).trim()) continue;
    const stage = parseStage(r.stage);
    const routes = Array.from({length:nRoutes}, (_,i) => +r.routes[i] || 0);
    const key = nameKey(r.name) + '|' + cat.age + cat.g;
    byKey.set(stage + '#' + key, {stage, key, name: displayName(r.name), cat, branch: parseBranch(r.branch),
      coach: displayName(r.coach), routes, total: routes.reduce((s,v) => s + v, 0)});
  }
  const recs = [...byKey.values()];
  rankGroups(recs, r => r.stage + '|' + r.cat.age + r.cat.g);

  const stages = [...new Set([...CONFIG.STAGES, ...recs.map(r => r.stage)])].sort((a,b) => a - b);
  const held = stages.filter(n => recs.some(r => r.stage === n));                // этапы, по которым уже есть результаты
  const ath = new Map();     // общий итог: сумма баллов за все этапы
  for(const r of [...recs].sort((a,b) => a.stage - b.stage)){
    let a = ath.get(r.key);
    if(!a) ath.set(r.key, a = {key:r.key, cat:r.cat, st:{}, total:0});
    a.st[r.stage] = r; a.total += r.total;
    a.name = r.name; a.branch = r.branch; a.coach = r.coach;     // данные из последнего этапа
  }
  const athletes = [...ath.values()];
  athletes.forEach(a => { a.inCup = !CONFIG.REQUIRE_ALL_STAGES || held.every(n => a.st[n]); a.place = a.bplace = null; });
  rankGroups(athletes.filter(a => a.inCup), a => a.cat.age + a.cat.g);
  const final = CONFIG.STAGES.every(n => held.includes(n));                       // проведены все этапы кубка
  return {recs, athletes, stages, held, final};
}

/* демо-данные: без SHEET_ID или с ?demo в адресе */
const DEMO_META = [
  ['Фиолетовая','5Б',4,7,10], ['Синяя','6А',7,14,21], ['Жёлтая','6Б',13,26,39], ['Салатовая','5С',5,9,14],
  ['Чёрная','6А',7,14,21], ['Розовая','6С',24,48,72], ['Красная','7А',45,90,130], ['Жёлтая','6Б',13,26,39],
  ['Розовая','6С',24,48,72], ['Салатовая','7А',45,90,130], ['Красная','5А',2,4,6], ['Оранжевая','6Б',13,26,39],
].map(([c,g,z1,z2,top],i) => parseRoute(`Трасса ${i+1}. ${c} ${g}. зона1 -${z1}Б, зона2 -${z2}Б, топ-${top}Б.`, i+1));
function demoRows(){
  let seed = 20261024; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const boys = ['Артём','Максим','Михаил','Иван','Даниил','Лев','Марк','Егор','Тимофей','Матвей','Кирилл','Роман','Никита','Арсений','Фёдор','Платон'];
  const girls = ['Анна','София','Мария','Ева','Варвара','Алиса','Полина','Виктория','Василиса','Вероника','Дарья','Ксения','Милана','Ульяна','Таисия','Злата'];
  const sur = ['Смирнов','Кузнецов','Попов','Волков','Соловьёв','Лебедев','Козлов','Новиков','Морозов','Орлов','Зайцев','Белов','Медведев','Егоров','Павлов','Семёнов','Голубев','Виноградов','Богданов','Тарасов','Жуков','Комаров','Фролов','Гусев'];
  const coaches = {
    galaktika:['Загребельный Павел','Ануфриева Дарья','Мачнева Елена','Кравченко Мария','Щербань Дарья','Соколова Зоя','Дерюжина Валерия'],
    skazka:['Власенко Владислав','Тихомирова Дарья','Подгорная Алена','Кипенко Кристина','Дивизнюк Юлия','Иванова Кристина','Расторгуева Ольга'],
    krasnaya:['Герасименко Алексей','Бецуков Ислам','Пешехонов Александр','Павлоградский Алексей'],
  };
  const diff = DEMO_META.map(m => Math.log(m.top) / Math.log(130));           // сложность трассы 0…1
  const ppl = [], rows = [];
  for(const b of BRANCHES) for(const [ai,age] of AGES.entries()) for(const g of GENDERS){
    const n = Math.floor(rnd() * (b.id === 'krasnaya' ? 6 : 10));
    for(let k=0; k<n; k++){
      const s = pick(sur);
      ppl.push({name:(g === 'Ж' ? s + 'а' : s) + ' ' + (g === 'Ж' ? pick(girls) : pick(boys)),
        cat:`${age} лет · ${g}`, branch:b.name, coach:pick(coaches[b.id]), lvl: .25 + ai * .13 + rnd() * .3});
    }
  }
  for(const stage of [1, 2]) for(const p of ppl){
    if(rnd() < (stage === 1 ? .1 : .25)) continue;          // не все участвуют в каждом этапе
    const routes = DEMO_META.map((m,i) => {
      const x = p.lvl + stage * .04 - diff[i] + (rnd() - .5) * .35;
      return x > .15 ? m.top : x > 0 ? m.z2 : x > -.15 ? m.z1 : 0;
    });
    rows.push({stage:String(stage), cat:p.cat, name:p.name, branch:p.branch, coach:p.coach, routes});
  }
  return rows;
}

async function load(){
  if(DEMO){
    state.meta = DEMO_META; state.D = build(demoRows(), DEMO_META.length); state.updated = new Date();
    return render();
  }
  try{
    const {rows, meta} = parseSheet(await fetchSheet());
    state.meta = meta; state.D = build(rows, meta.length); state.updated = new Date(); state.error = null;
  }catch(e){
    state.error = e.message || String(e); console.warn('Таблица:', e);
    if(!state.D){ state.meta = DEMO_META; state.D = build([], DEMO_META.length); }
  }
  render();
}

/* ---------- отрисовка ---------- */
function tabs(){
  const stages = state.D ? state.D.stages : CONFIG.STAGES;
  return [...stages.map(n => ({id:'s'+n, n, name:`${n} этап`, long:` ${CONFIG.CUP_GEN}`, color:'#6C619C', cls:'t-stage'})),
          {id:'rules', name:'Регламент', long:'', color:'#64B145', cls:'t-rules'},
          {id:'all', name:'Общий итог', long:'', color:'#0A0A0D', cls:'t-all'}];
}
const modeOf = tab => state.mode[tab] || (tab === 'all' ? 'table' : 'top');

function renderTabs(){
  const el = document.getElementById('tabs'), list = tabs();
  el.style.setProperty('--cols', Math.ceil(list.length / 2));
  el.innerHTML = list.map(t =>
    `<button class="tab ${t.cls}" role="tab" style="--c:${t.color}" data-tab="${t.id}" aria-selected="${state.tab===t.id}"><i></i><span>${t.name}<span class="long">${t.long}</span></span></button>`).join('');
}

function renderToolbar(){
  const tb = document.getElementById('toolbar');
  if(state.tab === 'rules'){ tb.innerHTML = ''; tb.hidden = true; return; }
  tb.hidden = false;
  const mode = modeOf(state.tab);
  const modes = [['top','Топ-10'], ['table', state.tab === 'all' ? 'Все результаты' : 'Протокол']];
  tb.innerHTML = `
    <div class="seg" role="group" aria-label="Вид">${modes.map(([m,l]) => `<button data-mode="${m}" aria-pressed="${mode===m}">${l}</button>`).join('')}</div>
    ${mode === 'table' ? `<label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Фамилия спортсмена или тренера" value="${esc(state.q)}" autocomplete="off"></label>` : ''}
    <div class="chips" aria-label="Филиал">${[{id:'all',name:'Все филиалы'},...BRANCHES].map(b =>
      `<button class="chip" data-branch="${b.id}" aria-pressed="${state.branch===b.id}" style="--c:${b.color||'#0A0A0D'}">${b.id==='all'?'':'<i></i>'}${b.name}</button>`).join('')}</div>
    <div class="chips" aria-label="Возраст">${['all',...AGES].map(a =>
      `<button class="chip" data-age="${a}" aria-pressed="${state.age===a}">${a==='all'?'Все возрасты':a+' лет'}</button>`).join('')}</div>`;
}

function agesIn(list){
  const extra = [...new Set(list.map(r => r.cat.age))].filter(a => !AGES.includes(a));
  const all = [...AGES, ...extra].sort((a,b) => ageOrder(a) - ageOrder(b));
  return state.age === 'all' ? all : [state.age];
}
const byCat = (list, age, g, pk) => list.filter(r => r.cat.age === age && r.cat.g === g)
  .sort((x,y) => (x[pk] ?? 1e9) - (y[pk] ?? 1e9) || y.total - x.total || x.name.localeCompare(y.name,'ru'));
function placeBadge(p, sm){ return p == null ? `<span class="place out${sm?' sm':''}"><span>—</span></span>` : `<span class="place${sm?' sm':''}${p<=3?' p'+p:''}"><span>${p}</span></span>`; }
function subline(r){
  const b = BR[r.branch];
  return [b ? `<i style="--c:${b.color}"></i>${b.name}` : '', r.coach ? esc(r.coach) : ''].filter(Boolean).join(' · ');
}

/* Топ-10: карточки Ж/М по возрастам */
function cardsView(list, extra = {}){
  const own = state.branch !== 'all';
  const L = own ? list.filter(r => r.branch === state.branch) : list;
  const pk = own ? 'bplace' : 'place';
  let html = '';
  for(const age of agesIn(L)){
    const pair = GENDERS.map(g => byCat(L, age, g, pk));
    if(state.age === 'all' && !pair[0].length && !pair[1].length && !(extra.out || []).some(r => r.cat.age === age)) continue;
    pair.forEach((recs, i) => {
      const outN = (extra.out || []).filter(r => r.cat.age === age && r.cat.g === GENDERS[i] && (!own || r.branch === state.branch)).length;
      const outNote = outN ? `<p class="none">+ ${outN} вне зачёта кубка — пройдены не все этапы</p>` : '';
      const head = `<header class="card-h"><span class="age">${age} лет</span><span class="g" style="--c:#6C619C">${GENDERS[i]}</span>`;
      if(!recs.length){ html += `<article class="card is-empty">${head}</header><p class="none">Пока нет результатов</p>${outNote}</article>`; return; }
      const top = recs.slice(0, CONFIG.TOP);
      html += `<article class="card">${head}<span class="cnt">${people(recs.length)}</span></header>
        <ol class="rows">${top.map(r => `<li class="row">${placeBadge(r[pk])}
          <div><div class="nm">${esc(r.name)}</div><div class="co">${subline(r)}</div></div>
          <b class="pts">${fmt(r.total)}</b></li>`).join('')}</ol>
        ${recs.length > top.length ? `<button class="more" data-more="${age}">Все ${recs.length} →</button>` : ''}${outNote}</article>`;
    });
  }
  return html ? `<div class="grid">${html}</div>` : `<div class="empty">${list.length ? 'Под выбранные фильтры результатов нет' : 'Результатов пока нет'}</div>`;
}

function routeHead(m, n){
  if(!m) return `<th class="c-r" title="Трасса ${n}">Т${n}</th>`;
  const tip = [`Трасса ${n}`, [m.color, m.grade].filter(Boolean).join(' '),
    m.top != null ? `зона 1 — ${m.z1}, зона 2 — ${m.z2}, топ — ${m.top}` : ''].filter(Boolean).join(' · ');
  return `<th class="c-r" title="${esc(tip)}"><span class="rt"><i style="--h:${m.hex}"></i>Т${n}</span>${m.grade ? `<small>${esc(m.grade)}</small>` : ''}</th>`;
}

/* Таблицы: протокол этапа или общий итог */
function tablesView(list, kind){
  const q = norm(state.q), D = state.D, meta = state.meta;
  const match = r => (state.branch === 'all' || r.branch === state.branch) && (!q || norm(r.name).includes(q) || norm(r.coach).includes(q));
  const f = list.filter(match);
  const nR = kind === 'stage' ? Math.max(meta.length, ...list.map(r => r.routes.length), 0) : 0;
  const cols = kind === 'stage'
    ? Array.from({length:nR}, (_,i) => routeHead(meta[i], i + 1)).join('') + '<th class="c-sum">Сумма</th>'
    : D.stages.map(n => `<th class="c-st">${n} этап</th>`).join('') + '<th class="c-sum">Итог</th>';
  const nCols = 3 + (kind === 'stage' ? nR : D.stages.length) + 1;
  const cells = r => kind === 'stage'
    ? r.routes.map((v,i) => { const l = level(v, meta[i]); return `<td class="c-r"><span class="v ${l}">${fmt(v)}</span></td>`; }).join('')
    : D.stages.map(n => { const s = r.st[n]; return s ? `<td class="c-st"><b>${fmt(s.total)}</b><small>${s.place} место</small></td>` : '<td class="c-st z">—</td>'; }).join('');
  const row = r => { const b = BR[r.branch]; return `<tr${kind === 'total' && !r.inCup ? ' class="is-out"' : ''}>
    <td class="c-pl">${placeBadge(r.place, true)}</td>
    <td class="c-nm"><div class="nm">${esc(r.name)}</div>${r.coach?`<div class="co">${esc(r.coach)}</div>`:''}</td>
    <td class="c-br">${b ? `<i style="--c:${b.color}"></i>${b.name}` : '—'}</td>
    ${cells(r)}<td class="c-sum">${fmt(r.total)}</td></tr>`; };
  let html = '';
  for(const age of agesIn(list)) for(const g of GENDERS){
    const recs = byCat(f, age, g, 'place');
    if(!recs.length) continue;
    const inC = kind === 'total' ? recs.filter(r => r.inCup) : recs, out = kind === 'total' ? recs.filter(r => !r.inCup) : [];
    html += `<section class="cat"><header class="cat-h"><span class="age">${age} лет</span><span class="g" style="--c:#0A0A0D">${g}</span><span class="cnt">${people(inC.length)}${out.length ? ` + ${out.length} вне зачёта` : ''}</span></header>
      <div class="tbl"><table><thead><tr><th class="c-pl">Место</th><th class="c-nm">Спортсмен</th><th class="c-br">Филиал</th>${cols}</tr></thead>
      <tbody>${inC.map(row).join('')}${out.length ? `<tr class="divider"><td colspan="${nCols}"><span>Вне зачёта кубка — пройдены не все этапы</span></td></tr>${out.map(row).join('')}` : ''}</tbody></table></div></section>`;
  }
  const legend = kind === 'stage' && meta.some(m => m.top != null)
    ? `<div class="legend"><span><b class="v top">топ</b>Топ</span><span><b class="v z2">з2</b>Зона 2</span><span><b class="v z1">з1</b>Зона 1</span><span><b class="v z">0</b>Без зоны</span></div>` : '';
  return html ? legend + html : `<div class="empty">${list.length ? 'Ничего не найдено' : 'Результатов пока нет'}</div>`;
}

function stageLine(n){
  const i = CONFIG.STAGE_INFO[n];
  return i ? `${i.place} · ${i.dates}` : `${n} этап ${CONFIG.CUP_GEN}`;
}

function renderView(){
  const v = document.getElementById('view'), D = state.D;
  if(state.tab === 'rules'){ v.innerHTML = document.getElementById('rules-tpl').innerHTML; return; }
  if(!D){ v.innerHTML = '<div class="loading">Загружаем результаты…</div>'; return; }
  const mode = modeOf(state.tab), own = state.branch !== 'all' ? BR[state.branch] : null;
  if(state.tab === 'all'){
    const all = D.athletes, inCup = all.filter(a => a.inCup), out = all.filter(a => !a.inCup);
    const tiles = [{name:'В зачёте кубка', color:'#6C619C', n:inCup.length}, ...BRANCHES.map(b => ({name:b.name, color:b.color, n:inCup.filter(r => r.branch === b.id).length}))];
    const pre = !D.final && D.held.length
      ? `<div class="notice info">Предварительный итог: проведено ${D.held.length} из ${CONFIG.STAGES.length} ${plural(CONFIG.STAGES.length,['этапа','этапов','этапов'])}. В борьбе за кубок участвуют только спортсмены, прошедшие оба этапа.</div>` : '';
    v.innerHTML = `<div class="sec-head" style="--c:#0A0A0D"><div><h2><i class="dia"></i>Общий итог</h2>
        <p>${CONFIG.CUP} · сумма баллов за оба этапа</p></div></div>
      ${pre}
      <div class="tiles">${tiles.map(t => `<div class="tile" style="--c:${t.color}"><b>${t.n}</b><span>${t.name}</span></div>`).join('')}</div>
      <p class="hint">${mode === 'top' ? `Топ-${CONFIG.TOP} в каждой категории по сумме этапов${own ? ` · места внутри филиала «${own.name}»` : ''}` : 'Баллы и место на каждом этапе · итог — сумма этапов'} · при равенстве баллов место общее</p>
      ${mode === 'top' ? cardsView(inCup, {out}) : tablesView(all, 'total')}`;
  } else {
    const n = +state.tab.slice(1), list = D.recs.filter(r => r.stage === n);
    const nR = state.meta.length || 12;
    v.innerHTML = `<div class="sec-head" style="--c:#6C619C"><div><h2><i class="dia"></i>${n} этап</h2>
        <p>${stageLine(n)}</p></div>
        <div class="stat"><b>${list.length}</b><span>${plural(list.length,['участник','участника','участников'])}</span></div></div>
      <p class="hint">${mode === 'top' ? `Топ-${CONFIG.TOP} в каждой категории${own ? ` · места внутри филиала «${own.name}»` : ''}` : 'Протокол этапа: баллы по трассам и место в категории'} · сумма баллов за ${routesWord(nR)}</p>
      ${list.length ? (mode === 'top' ? cardsView(list) : tablesView(list, 'stage'))
        : `<div class="empty"><b>Результатов ${n} этапа пока нет</b><br>${CONFIG.STAGE_INFO[n] ? `Этап проходит в ${esc(CONFIG.STAGE_INFO[n].place)}: ${esc(CONFIG.STAGE_INFO[n].dates)}. ` : ''}Результаты появятся здесь, как только тренеры внесут их в форму — в течение 3 дней после пролаза.</div>`}`;
  }
}

function renderMeta(){
  const m = document.getElementById('meta'), D = state.D;
  const t = state.updated ? state.updated.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
  m.className = 'meta' + (DEMO ? ' demo' : state.error ? ' err' : '');
  m.innerHTML = `<span class="dot"></span><span>${!D ? 'Загружаем результаты…' : DEMO ? 'Демо-данные' : state.error ? 'Нет связи с таблицей' : `Обновлено в ${t} · ${people(D.athletes.length)}`}</span>`;
  document.getElementById('notice').innerHTML = DEMO
    ? `<div class="notice">Показаны демо-данные${CONFIG.SHEET_ID ? ': в адресе страницы есть <code>?demo</code>. Без него сайт берёт результаты из таблицы' : '. Чтобы выводились реальные результаты, впишите ID таблицы в <code>CONFIG.SHEET_ID</code>'}.</div>`
    : state.error && state.tab !== 'rules' ? `<div class="notice err">Не удалось загрузить результаты. Проверьте интернет-соединение и что таблица открыта по ссылке («Все, у кого есть ссылка — читатель»).</div>` : '';
}

function pickDefaultTab(){
  const h = location.hash.slice(1);
  if(tabs().some(t => t.id === h)) return h;
  const held = state.D ? state.D.held : [];
  return 's' + (held.length ? held[held.length - 1] : (CONFIG.STAGES[0] || 1));   // последний проведённый этап
}

function render(){
  if(!state.userTab || !tabs().some(t => t.id === state.tab)) state.tab = pickDefaultTab();
  renderTabs(); renderToolbar(); renderView(); renderMeta();
}

function setTab(id){
  if(!tabs().some(t => t.id === id)) id = pickDefaultTab();
  state.tab = id; state.userTab = true;
  if(location.hash.slice(1) !== id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
  renderTabs(); renderToolbar(); renderView(); renderMeta();
}
const scrollToContent = () => window.scrollTo({top: document.querySelector('.hero').offsetHeight, behavior:'smooth'});

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if(t) return setTab(t.dataset.tab);
  const md = e.target.closest('[data-mode]');
  if(md){ state.mode[state.tab] = md.dataset.mode; renderToolbar(); return renderView(); }
  const a = e.target.closest('[data-age]');
  if(a){ state.age = a.dataset.age; document.querySelectorAll('[data-age]').forEach(x => x.setAttribute('aria-pressed', x.dataset.age === state.age)); return renderView(); }
  const b = e.target.closest('[data-branch]');
  if(b){ state.branch = b.dataset.branch; document.querySelectorAll('[data-branch]').forEach(x => x.setAttribute('aria-pressed', x.dataset.branch === state.branch)); return renderView(); }
  const more = e.target.closest('[data-more]');
  if(more){ state.mode[state.tab] = 'table'; state.age = more.dataset.more; renderToolbar(); renderView(); scrollToContent(); }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ state.q = e.target.value; renderView(); } });
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));

document.getElementById('addr').innerHTML = BRANCHES.map(b => `<span style="--c:${b.color}"><i></i>${b.full}, ${b.addr}</span>`).join('');
render();
load();
if(!DEMO) setInterval(load, CONFIG.REFRESH_MIN * 60000);
</script>
</body>
</html>
